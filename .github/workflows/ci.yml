name: CI
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: forma
          POSTGRES_PASSWORD: test-only-password
          POSTGRES_DB: forma_test
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://forma:test-only-password@127.0.0.1:5432/forma_test?sslmode=disable
      TEST_DATABASE_URL: postgresql://forma:test-only-password@127.0.0.1:5432/forma_test?sslmode=disable
      APP_ORIGIN: http://localhost:3000
      API_URL: http://127.0.0.1:8080
      APP_ENV: development
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: apps/api/go.mod
          cache-dependency-path: apps/api/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: make install
      - run: make test check build
      - run: make migrate
      - run: npm --prefix apps/web exec -- playwright install --with-deps chromium
      - name: Start application
        run: |
          ./bin/api > /tmp/forma-api.log 2>&1 &
          npm --prefix apps/web start > /tmp/forma-web.log 2>&1 &
          for attempt in $(seq 1 30); do curl -sf http://localhost:3000/login > /dev/null && break; sleep 2; done
      - name: Browser tests
        run: |
          export CHROMIUM_PATH=$(node -e "console.log(require('./apps/web/node_modules/playwright').chromium.executablePath())")
          make test-e2e
      - name: Logs on failure
        if: failure()
        run: cat /tmp/forma-api.log /tmp/forma-web.log || true
