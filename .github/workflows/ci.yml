name: CI
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          # The credentials and database .env.testing names: every test run
          # uses that file, here as on a laptop.
          POSTGRES_USER: lewcontext
          POSTGRES_PASSWORD: password
          POSTGRES_DB: lewcontext_test
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      APP_NAME: lewcontext
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: apps/api/go.mod
          cache-dependency-path: apps/api/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: make install
      - run: make test check build
      - run: npm --prefix apps/web exec -- playwright install --with-deps chromium
      # Playwright builds and starts the server (make serve-test) on :3100 against its own
      # lewcontext_test_3100; its output appears in the log prefixed [WebServer].
      - name: Browser tests
        run: |
          export CHROMIUM_PATH=$(node -e "console.log(require('./apps/web/node_modules/playwright').chromium.executablePath())")
          make test-e2e
