<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{ template "title" . }}</title>
  </head>
  <body style="margin: 0; padding: 32px 16px; background: #f4f4f5; font-family: Inter, Arial, sans-serif; color: #18181b">
    <div style="max-width: 480px; margin: 0 auto; padding: 32px; background: #ffffff; border-radius: 12px">
      <table role="presentation" cellpadding="0" cellspacing="0" style="margin: 0 0 24px; border-collapse: collapse">
        <tr>
          <td style="padding: 0 10px 0 0; vertical-align: middle">
            <img src="cid:logo" width="32" height="32" alt="" style="display: block; border: 0; border-radius: 8px" />
          </td>
          <td style="vertical-align: middle; font-size: 18px; line-height: 24px; font-weight: 600; letter-spacing: -0.01em; color: #09090b">{{ app }}</td>
        </tr>
      </table>
      {{ template "content" . }}
    </div>
  </body>
</html>
