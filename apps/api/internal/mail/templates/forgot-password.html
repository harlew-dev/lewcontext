<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Reset your password</title>
  </head>
  <body style="margin: 0; padding: 32px 16px; background: #f4f4f5; font-family: Inter, Arial, sans-serif; color: #18181b">
    <div style="max-width: 480px; margin: 0 auto; padding: 32px; background: #ffffff; border-radius: 12px">
      <p style="margin: 0 0 16px; font-size: 16px; line-height: 24px">Hi {{ .Name }},</p>
      <p style="margin: 0 0 24px; font-size: 14px; line-height: 22px; color: #52525b">
        Someone asked to reset the password for your account. This link works once and expires in 30 minutes.
      </p>
      <p style="margin: 0 0 24px">
        <a
          href="{{ .URL }}"
          style="display: inline-block; padding: 10px 16px; background: #18181b; color: #ffffff; border-radius: 8px; font-size: 14px; font-weight: 600; text-decoration: none"
          >Reset your password</a
        >
      </p>
      <p style="margin: 0 0 8px; font-size: 13px; line-height: 20px; color: #71717a">
        If the button doesn’t work, paste this link into your browser:
      </p>
      <p style="margin: 0 0 24px; font-size: 13px; line-height: 20px; word-break: break-all; color: #52525b">{{ .URL }}</p>
      <p style="margin: 0; font-size: 13px; line-height: 20px; color: #71717a">
        If that wasn’t you, ignore this email. Your password hasn’t changed.
      </p>
    </div>
  </body>
</html>
